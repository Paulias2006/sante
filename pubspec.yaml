name: sante
description: "SantéTogo - Plateforme médicale numérique pour cliniques, patients et pharmacies"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  provider: ^6.1.0
  go_router: ^13.2.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  flutter_riverpod: ^2.4.10
  image_picker: ^1.0.7
  google_fonts: ^6.2.1
  firebase_messaging: ^14.7.10
  uuid: ^4.0.0
  mobile_scanner: ^5.0.0
  camera: ^0.10.5
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/logos/
    - assets/icons/
    - assets/logo_sante.png
